name: Consolidación Post Firma checks

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/app/Utilidades/importadores/postfirma_importer.py"
      - "backend/app/expedientes/gastos/**"
      - "backend/app/informes/facturacion_router.py"
      - "frontend-app/src/pages/expedientes/FichaExpediente.jsx"
      - "frontend-app/src/pages/informes/Informes.jsx"
      - "frontend-app/src/pages/herramientas/CatalogoAbsis.jsx"
      - "frontend-app/src/pages/herramientas/ImportadorPostFirma.jsx"
      - ".github/workflows/consolidacion-postfirma-checks.yml"
  push:
    branches: [feature/consolidacion-gastos-postfirma]
    paths:
      - "backend/app/Utilidades/importadores/postfirma_importer.py"
      - "backend/app/expedientes/gastos/**"
      - "backend/app/informes/facturacion_router.py"
      - "frontend-app/src/pages/expedientes/FichaExpediente.jsx"
      - "frontend-app/src/pages/informes/Informes.jsx"
      - "frontend-app/src/pages/herramientas/CatalogoAbsis.jsx"
      - "frontend-app/src/pages/herramientas/ImportadorPostFirma.jsx"
      - ".github/workflows/consolidacion-postfirma-checks.yml"

jobs:
  backend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Comprobar sintaxis Python
        run: |
          python -m compileall -q \
            backend/app/Utilidades/importadores/postfirma_importer.py \
            backend/app/expedientes/gastos \
            backend/app/informes/facturacion_router.py

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar dependencias
        run: npm install --include=optional
      - name: Construir frontend
        run: npm run build
