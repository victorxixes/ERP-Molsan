name: Supabase integration connectivity and Storage smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - production/erp-molsan-2026-11-04
 
permissions:
  contents: read

concurrency:
  group: molsan-supabase-integration-smoke
  cancel-in-progress: false

jobs:
  connectivity-smoke-test:
    name: Backend PostgreSQL + private Storage smoke test
    if: github.ref == 'refs/heads/production/erp-molsan-2026-11-04'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.MOLSAN_SUPABASE_MIGRATION_DATABASE_URL }}
      SUPABASE_URL: https://powiprqarmluanplxpyb.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.MOLSAN_SUPABASE_SERVICE_ROLE_KEY }}
      MOLSAN_STORAGE_BUCKET: molsan-private
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements.txt

      - name: Test backend database engine against the integration Supabase project (read-only)
        shell: bash
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import text
          from sqlalchemy.engine import make_url
          from app.database import engine

          raw_url = os.environ.get("DATABASE_URL", "").strip()
          if not raw_url:
              raise SystemExit("BLOCKED: MOLSAN_SUPABASE_MIGRATION_DATABASE_URL is missing.")
          url = make_url(raw_url)
          project_ref = "powiprqarmluanplxpyb"
          if url.get_backend_name() != "postgresql":
              raise SystemExit("BLOCKED: DATABASE_URL is not PostgreSQL.")
          if url.port == 6543:
              raise SystemExit("BLOCKED: use the Supabase Session pooler (5432), not Transaction pooler (6543).")
          if not (project_ref in (url.host or "").lower()
                  or (url.username or "").lower().endswith("." + project_ref)):
              raise SystemExit("BLOCKED: database target does not match the approved ERP_Molsan integration project.")
          with engine.connect() as connection:
              result = connection.execute(text("""
                  SELECT current_database(),
                         current_user,
                         current_setting('server_version'),
                         (SELECT version_num FROM public.alembic_version LIMIT 1)
              """)).one()
              if result[3] != "20261104_0004":
                  raise SystemExit("FAILED: unexpected Alembic revision; expected 20261104_0004.")
              print("PASS: backend SQLAlchemy engine connected to the approved Supabase project.")
              print(f"Database: {result[0]} | Role: {result[1]} | PostgreSQL: {result[2]} | Alembic: {result[3]}")
              print("Only SELECT statements were executed; no schema or business data was changed.")
          engine.dispose()
          PY

      - name: Test private Storage upload, byte-for-byte download, and cleanup
        shell: bash
        run: |
          python - <<'PY'
          import os
          import uuid
          from app.supabase_storage import SupabasePrivateStorage, SupabaseStorageConfig

          service_key = os.environ.get("SUPABASE_SERVICE_ROLE_KEY", "").strip()
          if not service_key:
              print("::warning::STORAGE NOT RUN: add the GitHub Actions secret MOLSAN_SUPABASE_SERVICE_ROLE_KEY, then rerun this workflow.")
              raise SystemExit(0)

          config = SupabaseStorageConfig.from_env()
          if config.url != "https://powiprqarmluanplxpyb.supabase.co":
              raise SystemExit("BLOCKED: Storage URL does not match the approved integration project.")
          if config.bucket != "molsan-private":
              raise SystemExit("BLOCKED: unexpected Storage bucket.")

          storage = SupabasePrivateStorage(config=config)
          object_key = f"healthchecks/github-actions/{uuid.uuid4().hex}.pdf"
          payload = (
              b"%PDF-1.4\n"
              b"% MOLSAN private storage integration smoke test\n"
              b"1 0 obj<</Type/Catalog>>endobj\n"
              b"trailer<</Root 1 0 R>>\n"
              b"%%EOF\n"
          )
          try:
              storage.upload(object_key, payload, "application/pdf", upsert=False)
              downloaded = storage.download(object_key)
              if downloaded != payload:
                  raise SystemExit("FAILED: downloaded bytes differ from uploaded bytes.")
              if not storage.exists(object_key):
                  raise SystemExit("FAILED: uploaded object was not found by exists().")
              print("PASS: private Storage upload and byte-for-byte download verified.")
          finally:
              # Attempt cleanup even if the upload request failed after the server accepted it.
              storage.delete(object_key)
              if storage.exists(object_key):
                  raise SystemExit("FAILED: temporary Storage object still exists after cleanup.")
              print("PASS: temporary Storage object deleted and absence verified.")
          PY
# trigger integration smoke test
