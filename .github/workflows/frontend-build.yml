name: Frontend build

on:
  push:
    branches: [production/erp-molsan-2026-11-04]
    paths:
      - "frontend-app/**"
      - ".github/workflows/frontend-build.yml"
  pull_request:
    paths:
      - "frontend-app/**"
      - ".github/workflows/frontend-build.yml"

permissions:
  contents: read

concurrency:
  group: frontend-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-app
    env:
      # Solo para compilar en CI. No es una dirección desplegable ni productiva.
      VITE_API_URL: https://molsan-preview.invalid/api
      VITE_WS_URL: wss://molsan-preview.invalid
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependencias bloqueadas
        run: npm ci --include=optional --no-audit --no-fund
      - name: Compilar frontend
        run: npm run build
