name: Frontend build

on:
  pull_request:
    paths:
      - "frontend-app/**"
      - ".github/workflows/frontend-build.yml"
  push:
    branches:
      - main
      - molsan-premium-2027-production-ready
    paths:
      - "frontend-app/**"
      - ".github/workflows/frontend-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build frontend
        run: npm run build
