name: Frontend dependency security audit

on:
  pull_request:
    paths:
      - "frontend-app/package.json"
      - "frontend-app/package-lock.json"
      - ".github/workflows/frontend-security-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-app/package.json
      - name: Generate a reproducible dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Audit dependencies and print actionable findings
        run: |
          npm audit --json > npm-audit-report.json || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('npm-audit-report.json', 'utf8'));
          console.log('AUDIT COUNTS:', JSON.stringify(report.metadata?.vulnerabilities ?? {}));
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            console.log(JSON.stringify({
              name,
              severity: item.severity,
              direct: item.isDirect,
              installedRange: item.range,
              fixAvailable: item.fixAvailable,
              via: item.via.map(v => typeof v === 'string' ? v : {
                title: v.title, range: v.range, url: v.url
              }),
              nodes: item.nodes
            }));
          }
          NODE
      - name: Preserve full audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-npm-audit-report
          path: frontend-app/npm-audit-report.json
          if-no-files-found: ignore
