name: Supabase schema audit

on:
  push:
    branches:
      - release/molsan-premium-2027-candidate
    paths:
      - "backend/scripts/audit_supabase_schema.py"
      - "backend/app/**"
      - ".github/workflows/supabase-schema-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Export ORM schema without database access
        env:
          MOLSAN_SCHEMA_AUDIT_OUTPUT: schema-audit
        run: python backend/scripts/audit_supabase_schema.py
      - name: Upload schema audit
        uses: actions/upload-artifact@v4
        with:
          name: molsan-supabase-schema-audit
          path: schema-audit/
          if-no-files-found: error
          retention-days: 7
