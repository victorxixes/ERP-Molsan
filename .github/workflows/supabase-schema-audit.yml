name: Supabase schema audit

on:
  push:
    branches:
      - release/molsan-premium-2027-candidate
    paths:
      - "backend/scripts/audit_supabase_schema.py"
      - "backend/app/**"
      - ".github/workflows/supabase-schema-audit.yml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/scripts/audit_supabase_schema.py"
      - "backend/app/**"
      - ".github/workflows/supabase-schema-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-and-migration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Export ORM and auxiliary SQL schema
        env:
          MOLSAN_SCHEMA_AUDIT_OUTPUT: schema-audit
          PYTHONPATH: ${{ github.workspace }}
        run: python backend/scripts/audit_supabase_schema.py
      - name: Set up Node for Supabase CLI
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Discover Supabase CLI commands
        run: |
          npx --yes supabase@3.0.0 --version
          npx --yes supabase@3.0.0 init --help
          npx --yes supabase@3.0.0 migration --help
          npx --yes supabase@3.0.0 migration new --help
      - name: Create versioned Supabase baseline migration
        run: |
          npx --yes supabase@3.0.0 init
          npx --yes supabase@3.0.0 migration new erp_molsan_initial_schema
          MIGRATION_FILE="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort | tail -n 1)"
          test -n "$MIGRATION_FILE"
          {
            echo "-- ERP_Molsan Preview baseline. Target project ref: powiprqarmluanplxpyb."
            echo "-- Generated from SQLAlchemy metadata and reviewed auxiliary DDL."
            cat schema-audit/orm-schema.sql
            cat schema-audit/raw-ddl.sql
            cat <<'SQL'

-- Security baseline: ERP tables are accessed only through the authenticated
-- MOLSAN backend. No direct Data API grants are given to anon/authenticated.
DO $rls$
DECLARE tabla RECORD;
BEGIN
    FOR tabla IN
        SELECT tablename
        FROM pg_tables
        WHERE schemaname = 'public'
    LOOP
        EXECUTE format(
            'ALTER TABLE %I.%I ENABLE ROW LEVEL SECURITY',
            'public',
            tabla.tablename
        );
    END LOOP;
END
$rls$;

REVOKE ALL ON ALL TABLES IN SCHEMA public FROM anon, authenticated;
REVOKE ALL ON ALL SEQUENCES IN SCHEMA public FROM anon, authenticated;
ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
    REVOKE ALL ON TABLES FROM anon, authenticated;
ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
    REVOKE ALL ON SEQUENCES FROM anon, authenticated;
SQL
          } > "$MIGRATION_FILE"
          echo "$MIGRATION_FILE" > schema-audit/migration-path.txt
          echo "Generated migration: $MIGRATION_FILE"
      - name: Commit generated migration to candidate branch
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const branch = process.env.GITHUB_REF_NAME;
            const migrationPath = fs.readFileSync('schema-audit/migration-path.txt', 'utf8').trim();
            const paths = ['supabase/config.toml', migrationPath];
            const { owner, repo } = context.repo;
            const ref = await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
            const base = await github.rest.git.getCommit({ owner, repo, commit_sha: ref.data.object.sha });
            const tree = await github.rest.git.createTree({
              owner,
              repo,
              base_tree: base.data.tree.sha,
              tree: paths.map(path => ({
                path,
                mode: '100644',
                type: 'blob',
                content: fs.readFileSync(path, 'utf8')
              }))
            });
            const commit = await github.rest.git.createCommit({
              owner,
              repo,
              message: 'Add generated Supabase ERP_Molsan baseline migration',
              tree: tree.data.sha,
              parents: [ref.data.object.sha]
            });
            await github.rest.git.updateRef({
              owner,
              repo,
              ref: `heads/${branch}`,
              sha: commit.data.sha,
              force: false
            });
            core.info(`Committed Supabase baseline migration: ${migrationPath}`);

      - name: Upload audit and generated migration
        uses: actions/upload-artifact@v4
        with:
          name: molsan-supabase-schema-migration
          path: |
            schema-audit/
            supabase/
          if-no-files-found: error
          retention-days: 7
