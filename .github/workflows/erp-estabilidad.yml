name: ERP-Molsan · estabilidad básica

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: erp-estabilidad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-build:
    name: Compilar frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-app
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias como Render
        run: npm install --no-audit --no-fund
      - name: Compilar Vite
        run: npm run build

  backend-syntax:
    name: Comprobar sintaxis Python
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compilar todos los módulos Python
        run: python -m compileall -q backend
