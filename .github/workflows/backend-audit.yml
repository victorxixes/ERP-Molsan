name: Backend audit

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-audit.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-and-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest

      - name: Compile backend modules
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m compileall -q backend

      - name: Run backend tests (isolated SQLite, no production database)
        env:
          PYTHONPATH: ${{ github.workspace }}
          DATABASE_URL: sqlite:///./backend-audit-test.db
          JWT_SECRET: test-only-secret-for-ci-never-use-in-production-32chars
        run: python -m pytest -q backend/tests
