name: Backend audit

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-audit.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-audit.yml"

permissions:
  contents: read

concurrency:
  group: backend-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite:////tmp/erp-molsan-audit.db
      JWT_SECRET: ci-audit-secret-not-for-production
      JWT_ALGORITHM: HS256
      PYTHONPATH: .
      ENVIRONMENT: test
      APP_ENV: test
      ADMIN_EMAIL: admin@audit.invalid
      ADMIN_PASSWORD: audit-only-password
      SUPER_ADMIN_EMAIL: admin@audit.invalid
      SUPER_ADMIN_PASSWORD: audit-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app
      - run: python -m pytest -q tests
