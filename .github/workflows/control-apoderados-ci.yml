name: Validar Control Apoderados
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/control-apoderados-facturas]
jobs:
  frontend-build:
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: https://molsan-glass-luxe-preview-api.onrender.com/api
      VITE_WS_URL: wss://molsan-glass-luxe-preview-api.onrender.com
    defaults:
      run:
        working-directory: frontend-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
  backend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m compileall -q backend/app
