name: EncargaGest checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/encargagest-mvp, feature/encargagest-safe-workspace]

permissions:
  contents: read

jobs:
  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --include=optional --no-audit --no-fund
      - name: Build
        run: npm run build

  backend-syntax:
    name: Backend Python syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile backend modules
        run: python -m compileall -q backend

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Import full FastAPI application
        env:
          DATABASE_URL: sqlite:////tmp/molsan-encargagest-ci.db
          JWT_SECRET: ci-smoke-test-secret-key-0123456789abcdef
          MOLSAN_STORAGE_ROOT: /tmp/molsan-encargagest-ci-storage
        run: |
          python -c "import backend.app.main; from backend.app.encargagest.router import crear_tablas_encargagest; crear_tablas_encargagest(); print('FastAPI import and EncargaGest table creation OK')"
          python -m unittest discover -s backend/tests -v
